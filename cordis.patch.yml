# Bundle layer for @dr-co/dsh-speech-gate.
#
# Installing the package mounts this row: `dsh.bundle.patch` in package.json points
# here, the profile applies it while composing, and the plugin shows up in the
# settings plugin list where it can be switched off or removed like any other.
#
# The default below transcribes through the model connector you already configured
# in the Host (`backend: configured-model`), so no secret is duplicated here.
#
# `provider` is spelled out on purpose. `whisper-1` is an OpenAI model, and a Host
# without that connector would otherwise carry a recognizer whose first call fails;
# with the provider named, the record is skipped with the reason `no-connector` and
# the rest of the roster keeps working. Change the row (or override it by the same
# id in the profile) if you use another service — other shapes below.
#
#   config:
#     backend: api                       # any OpenAI-compatible endpoint
#     endpoint: http://127.0.0.1:8080/v1
#     model: whisper-1
#
#   config:
#     backend: exec                      # a local command, stdin gets the WAV path
#     command: whisper-cli
#     args: ['-m', '/models/ggml-large-v3.bin', '-f']
#
#   config:
#     provider: yandex                   # Yandex SpeechKit, key from the settings card
#     language: ru
#     # apiKeyRef: YANDEX_SPEECHKIT_API_KEY   # only to share the synthesizer's key;
#                                             # otherwise STT_KEY_<ID> is generated
#                                             # and written into this profile entry
- insert:
    - id: dsh-speech-gate
      name: '@dr-co/dsh-speech-gate'
      config:
        backend: configured-model
        provider: openai
        model: whisper-1
